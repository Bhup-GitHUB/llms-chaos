apiVersion: v1
kind: Namespace
metadata:
  name: llms-chaos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: llms-chaos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: llms-chaos/gateway:latest
          ports:
            - containerPort: 8000
          env:
            - name: REGISTRY_URL
              value: http://ray-head:8010/v1/cluster/state
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: llms-chaos
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: llms-chaos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
