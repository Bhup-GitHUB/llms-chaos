cluster_name: llms-chaos
max_workers: 3
upscaling_speed: 1.0
idle_timeout_minutes: 5
docker:
  image: ""
  container_name: ""
  pull_before_run: false
  run_options: []
provider:
  type: local
  head_ip: 127.0.0.1
  worker_ips: []
auth:
  ssh_user: ubuntu
available_node_types:
  ray_head_default:
    min_workers: 0
    max_workers: 0
    resources: {"CPU": 4}
    node_config: {}
  ray_worker_default:
    min_workers: 3
    max_workers: 3
    resources: {"CPU": 2}
    node_config: {}
head_node_type: ray_head_default
file_mounts: {}
setup_commands: []
head_setup_commands:
  - pip install "ray[serve]>=2.40" "fastapi>=0.115" "uvicorn>=0.32" "httpx>=0.27"
worker_setup_commands:
  - pip install "ray[serve]>=2.40" "fastapi>=0.115" "uvicorn>=0.32" "httpx>=0.27"
head_start_ray_commands:
  - ray stop --force || true
  - RAY_heartbeat_timeout_ms=${RAY_HEARTBEAT_TIMEOUT_MS:-10000} RAY_heartbeat_check_interval_ms=${RAY_HEARTBEAT_CHECK_INTERVAL_MS:-1000} ray start --head --port=6379 --dashboard-host=0.0.0.0 --dashboard-port=8265 --num-cpus=4
worker_start_ray_commands:
  - ray stop --force || true
  - ray start --address=$RAY_HEAD_IP:6379 --num-cpus=2
env_vars:
  RAY_NAMESPACE: ${RAY_NAMESPACE:-llms-chaos}
  SUSPECT_THRESHOLD_S: ${SUSPECT_THRESHOLD_S:-2.0}
  DEAD_THRESHOLD_S: ${DEAD_THRESHOLD_S:-3.0}
  HEARTBEAT_RPC_TIMEOUT_S: ${HEARTBEAT_RPC_TIMEOUT_S:-0.4}
  RAY_HEARTBEAT_TIMEOUT_MS: ${RAY_HEARTBEAT_TIMEOUT_MS:-10000}
  RAY_HEARTBEAT_CHECK_INTERVAL_MS: ${RAY_HEARTBEAT_CHECK_INTERVAL_MS:-1000}
  WORKER_BACKEND_PORTS: ${WORKER_BACKEND_PORTS:-9001,9002,9003}
  WORKER_ADVERTISE_PORTS: ${WORKER_ADVERTISE_PORTS:-9101,9102,9103}
  RAY_DASHBOARD_PORT: ${RAY_DASHBOARD_PORT:-8265}
